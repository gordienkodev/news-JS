name: Deploy to GitHub Pages

on:
    push:
        branches: [news-api]
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: github-pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Node.js
              uses: actions/setup-node@v6
              with:
                  node-version: '22'
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Check types
              run: npm run typecheck

            - name: Lint
              run: npm run lint

            - name: Build
              env:
                  API_URL: ${{ vars.API_URL }}
                  API_KEY: ${{ secrets.API_KEY }}
              run: |
                  if [ -z "$API_URL" ] || [ -z "$API_KEY" ]; then
                      echo "::error::Set the API_URL repository variable and API_KEY repository secret in Settings > Secrets and variables > Actions."
                      exit 1
                  fi
                  npm run build -- --env envFile=.env.example

            - name: Upload Pages artifact
              uses: actions/upload-pages-artifact@v4
              with:
                  path: dist

    deploy:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Deploy to GitHub Pages
              id: deployment
              uses: actions/deploy-pages@v4
