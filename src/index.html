<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta http-equiv="X-UA-Compatible" content="ie=edge" />
        <title>NewsPortal</title>
    </head>

    <body>
        <header>
            <h1>News Portal</h1>
        </header>
        <main>
            <div class="sources buttons"></div>
            <nav class="sources__pagination" aria-label="Source pages" hidden>
                <button class="sources__previous" type="button" aria-label="Previous source page">←</button>
                <span class="sources__page" role="status"></span>
                <button class="sources__next" type="button" aria-label="Next source page">→</button>
            </nav>
            <div class="news"></div>
        </main>
        <footer>
            <a class="footer__author" href="https://github.com/GordienkoDev">GitHub</a>
            <span class="footer__year">2026</span>
            <a class="footer__course" href="https://rs.school/courses/javascript">
                <img
                    src="https://rs.school/_next/static/media/rss-logo.c19ce1b4.svg"
                    alt="RS School JavaScript course"
                    width="100"
                    height="40"
                />
            </a>
            <p class="copyright">Copyright <a href="https://newsapi.org">NewsAPI</a></p>
        </footer>

        <template id="sourceItemTemp">
            <button class="source__item" type="button" aria-pressed="false">
                <span class="source__item-name"></span>
            </button>
        </template>

        <template id="newsItemTemp">
            <div class="news__item">
                <div class="news__meta">
                    <div class="news__meta-photo"></div>
                    <ul class="news__meta-details">
                        <li class="news__meta-author"></li>
                        <li class="news__meta-date"></li>
                    </ul>
                </div>
                <div class="news__description">
                    <h2 class="news__description-title"></h2>
                    <h3 class="news__description-source"></h3>
                    <p class="news__description-content"></p>
                    <p class="news__read-more">
                        <a href="#">Read More</a>
                    </p>
                </div>
            </div>
        </template>
    </body>
</html>
